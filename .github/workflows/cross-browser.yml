name: Cross-Browser Tests

# The pull request check (site-validation.yml) runs the browser suite in Chromium only. This runs
# the same suite in Firefox and WebKit every night and on demand; it changes no files.
on:
  schedule:
    - cron: "37 6 * * *"   # 06:37 UTC daily
  workflow_dispatch:
    inputs:
      grep:
        description: Only run tests whose title matches this pattern (blank runs the whole suite)
        required: false
        default: ''
      repeat_each:
        description: Run each selected test this many times (to check a flaky test)
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.project }}

      - name: Run browser suite
        env:
          GREP: ${{ inputs.grep }}
          REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
        run: |
          args=(--project=${{ matrix.project }} --workers=4 --grep-invert @consent-eu --trace=retain-on-failure --repeat-each="$REPEAT_EACH")
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test "${args[@]}"

      # Screenshots and traces of failed tests; open a trace with `npx playwright show-trace`.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
