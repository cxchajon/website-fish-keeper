name: Security Headers Verify

# Read-only production check: the security headers and redirects Cloudflare serves for key pages,
# and any Content-Security-Policy violations a browser reports on them. Changes no files and commits
# nothing; results go to the job summary and a workflow artifact.
on:
  schedule:
    - cron: "15 9 * * 0"   # Sundays 09:15 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Cloudflare Security Headers
    # Pinned for Playwright; see site-validation.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch headers and redirects
        run: bash tests/live/security-headers.sh

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Chromium
        if: always()
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser CSP check
        if: always()
        run: npx playwright test --config=playwright.live.config.ts csp-console

      - name: Publish summary
        if: always()
        run: cat live-verify/security-headers.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-headers-verify
          path: |
            live-verify/
            test-results/
          if-no-files-found: ignore
